document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

<span style=\"flex:1;min-width:0\">\n          <span style=\"display:block;font-size:16.5px;font-weight:600;color:#23211D;letter-spacing:-.01em\">{{ it.title }}<\u002Fspan>\n          <span style=\"display:block;margin-top:3px;font-size:13px;color:#7C766B;line-height:1.35\">{{ it.sub }}<\u002Fspan>\n        <\u002Fspan>\n        <span style=\"width:30px;height:30px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;font:600 15px/1 'Public Sans',sans-serif;background:{{ it.badgeBg }};border:{{ it.badgeBorder }};color:#fff\">{{ it.rankLabel }}<\u002Fspan>\n      <\u002Fbutton>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n\n  <div style=\"flex:1\"><\u002Fdiv>\n  <div style=\"position:sticky;bottom:0;padding:14px 22px 40px;background:linear-gradient(#F8F4ED00,#F8F4ED 26%)\">\n    <button sc-camel-on-click=\"{{ next }}\" disabled=\"{{ pickIncomplete }}\" style=\"width:100%;height:58px;border:none;border-radius:16px;font-family:'Public Sans',sans-serif;font-size:17px;font-weight:600;cursor:pointer;color:{{ ctaColor }};background:{{ ctaBg }}\">{{ ctaLabel }}<\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ── PAIRING PROMPT ── -->\n<sc-if value=\"{{ isPair }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"flex:1;display:flex;flex-direction:column;padding:66px 22px 40px;animation:cvup .35s ease both\">\n  <div style=\"display:flex;gap:5px;margin-bottom:26px\">{{ dotsB }}<\u002Fdiv>\n  <div style=\"border-radius:20px;overflow:hidden;border:1px solid rgba(35,33,29,.1);background:#FFF\">\n    <div style=\"padding:20px 20px 22px;display:flex;flex-direction:column;gap:14px\">\n      <div style=\"display:flex;align-items:flex-start;justify-content:space-between;gap:12px\">\n        <div style=\"display:flex;gap:-6px\">\n          <span style=\"width:26px;height:26px;border-radius:50%;background:oklch(0.72 0.11 75);display:block\"><\u002Fspan>\n          <span style=\"width:26px;height:26px;border-radius:50%;background:oklch(0.56 0.08 150);display:block;margin-left:-9px;box-shadow:-2px 0 0 #FFF\"><\u002Fspan>\n        <\u002Fdiv>\n        <button sc-camel-on-click=\"{{ dismissPair }}\" style=\"border:none;background:#F1ECE2;width:30px;height:30px;border-radius:50%;cursor:pointer;color:#6E6A62;font-size:15px;line-height:1;font-family:'Public Sans',sans-serif\" style-hover=\"background:#E7E0D3\">×<\u002Fbutton>\n      <\u002Fdiv>\n      <h2 style=\"margin:0;font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-size:27px;line-height:1.15;color:#23211D;text-wrap:pretty\">Doing this with someone nearby?<\u002Fh2>\n      <p style=\"margin:0;font-size:15.5px;line-height:1.5;color:#5E5A51;text-wrap:pretty\">Talk it through together, then each submit your own. Two voices count twice.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"padding:13px 20px;background:#F4EFE5;border-top:1px solid rgba(35,33,29,.07);font:500 11.5px/1.4 'IBM Plex Mono',monospace;letter-spacing:.04em;color:#7C766B;text-transform:uppercase\">Suggestion only — nothing to do here<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"flex:1;min-height:20px\"><\u002Fdiv>\n  <button sc-camel-on-click=\"{{ next }}\" style=\"width:100%;height:58px;border:none;border-radius:16px;background:oklch(0.48 0.07 200);color:#fff;font:600 17px/1 'Public Sans',sans-serif;cursor:pointer\" style-hover=\"background:oklch(0.42 0.07 200)\">Keep going<\u002Fbutton>\n  <button sc-camel-on-click=\"{{ dismissPair }}\" style=\"margin-top:8px;width:100%;height:46px;border:none;background:none;color:#6E6A62;font:500 15px/1 'Public Sans',sans-serif;cursor:pointer\" style-hover=\"color:#23211D\">Not now<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ── WHY ── -->\n<sc-if value=\"{{ isWhy }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"flex:1;display:flex;flex-direction:column;padding:66px 22px 40px;animation:cvup .35s ease both\">\n  <div style=\"display:flex;gap:5px;margin-bottom:16px\">{{ dotsC }}<\u002Fdiv>\n  <div style=\"display:inline-flex;align-self:flex-start;align-items:center;gap:7px;padding:5px 10px;border-radius:100px;background:#EDE6DA;font:500 10.5px/1 'IBM Plex Mono',monospace;letter-spacing:.07em;color:#6E6A62;text-transform:uppercase\">Optional · open answer<\u002Fdiv>\n  <h2 style=\"margin:16px 0 0;font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-size:30px;line-height:1.1;color:#23211D\">Why does this matter to you?<\u002Fh2>\n  <p style=\"margin:9px 0 0;font-size:14.5px;color:#6E6A62;line-height:1.45\">Your top pick was <strong style=\"color:#23211D;font-weight:600\">{{ topPick }}<\u002Fstrong>. One sentence helps more than you'd think.<\u002Fp>\n\n  <textarea value=\"{{ why }}\" sc-camel-on-change=\"{{ setWhy }}\" rows=\"5\" placeholder=\"e.g. My kids use the after-school room every day and it closes too early.\" style=\"margin-top:20px;width:100%;box-sizing:border-box;padding:16px;border-radius:16px;border:1.5px solid rgba(35,33,29,.14);background:#FFF;font-family:'Public Sans',sans-serif;font-size:16px;line-height:1.5;color:#23211D;resize:none\" style-focus=\"border-color:oklch(0.48 0.07 200)\"><\u002Ftextarea>\n  <div style=\"margin-top:8px;font:500 11.5px/1 'IBM Plex Mono',monospace;color:#9A9284;text-align:right\">{{ whyCount }}<\u002Fdiv>\n\n  <div style=\"display:flex;align-items:center;gap:12px;margin:16px 0 14px\">\n    <span style=\"flex:1;height:1px;background:rgba(35,33,29,.12)\"><\u002Fspan>\n    <span style=\"font:500 10.5px/1 'IBM Plex Mono',monospace;letter-spacing:.08em;color:#9A9284\">OR SAY IT OUT LOUD<\u002Fspan>\n    <span style=\"flex:1;height:1px;background:rgba(35,33,29,.12)\"><\u002Fspan>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ voiceIdle }}\" hint-placeholder-val=\"{{ true }}\">\n    <button sc-camel-on-click=\"{{ startRec }}\" style=\"display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:15px 16px;border-radius:16px;background:#FFF;border:1.5px solid rgba(35,33,29,.12);cursor:pointer;font-family:'Public Sans',sans-serif\" style-hover=\"border-color:oklch(0.48 0.07 200)\">\n      <span style=\"width:44px;height:44px;flex:none;border-radius:50%;background:oklch(0.48 0.07 200);display:flex;align-items:center;justify-content:center\">\n        <span style=\"display:block;width:11px;height:19px;border-radius:100px;background:#fff\"><\u002Fspan>\n      <\u002Fspan>\n      <span style=\"flex:1\">\n        <span style=\"display:block;font-size:15.5px;font-weight:600;color:#23211D\">Record a voice note<\u002Fspan>\n        <span style=\"display:block;margin-top:2px;font-size:13px;color:#7C766B\">Up to 30 seconds · still optional<\u002Fspan>\n      <\u002Fspan>\n    <\u002Fbutton>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ voiceRecording }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"padding:15px 16px;border-radius:16px;background:#FFFDF8;border:1.5px solid oklch(0.48 0.07 200);display:flex;align-items:center;gap:14px\">\n      <span style=\"display:flex;align-items:center;gap:7px;font:500 13px/1 'IBM Plex Mono',monospace;color:oklch(0.48 0.07 200)\">\n        <span style=\"width:9px;height:9px;border-radius:50%;background:oklch(0.48 0.07 200);animation:cvpulse 1.1s ease-in-out infinite;display:block\"><\u002Fspan>{{ recTime }}\n      <\u002Fspan>\n      <span style=\"flex:1;display:flex;align-items:center;gap:3px;height:34px\">\n        <sc-for list=\"{{ bars }}\" as=\"b\" hint-placeholder-count=\"18\">\n          <span style=\"flex:1;height:{{ b.h }};border-radius:100px;background:oklch(0.48 0.07 200);opacity:.75;animation:cvwave 1s ease-in-out infinite;animation-delay:{{ b.d }};display:block\"><\u002Fspan>\n        <\u002Fsc-for>\n      <\u002Fspan>\n      <button sc-camel-on-click=\"{{ stopRec }}\" style=\"width:38px;height:38px;flex:none;border:none;border-radius:50%;background:oklch(0.48 0.07 200);cursor:pointer;display:flex;align-items:center;justify-content:center\" style-hover=\"background:oklch(0.42 0.07 200)\">\n        <span style=\"display:block;width:12px;height:12px;border-radius:3px;background:#fff\"><\u002Fspan>\n      <\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ voiceDone }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"padding:15px 16px;border-radius:16px;background:#FFF;border:1.5px solid rgba(35,33,29,.12);display:flex;align-items:center;gap:13px\">\n      <span style=\"width:38px;height:38px;flex:none;border-radius:50%;background:#E6EDEF;display:flex;align-items:center;justify-content:center\">\n        <span style=\"display:block;width:0;height:0;border-left:11px solid oklch(0.48 0.07 200);border-top:7px solid transparent;border-bottom:7px solid transparent;margin-left:3px\"><\u002Fspan>\n      <\u002Fspan>\n      <span style=\"flex:1;display:flex;align-items:center;gap:3px;height:26px\">\n        <sc-for list=\"{{ bars }}\" as=\"b\" hint-placeholder-count=\"18\">\n          <span style=\"flex:1;height:{{ b.h }};border-radius:100px;background:rgba(35,33,29,.22);display:block\"><\u002Fspan>\n        <\u002Fsc-for>\n      <\u002Fspan>\n      <span style=\"font:500 12.5px/1 'IBM Plex Mono',monospace;color:#7C766B\">{{ recTime }}<\u002Fspan>\n      <button sc-camel-on-click=\"{{ clearRec }}\" style=\"border:none;background:#F1ECE2;width:30px;height:30px;flex:none;border-radius:50%;cursor:pointer;color:#6E6A62;font:400 15px/1 'Public Sans',sans-serif\" style-hover=\"background:#E7E0D3\">×<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <div style=\"flex:1;min-height:16px\"><\u002Fdiv>\n  <button sc-camel-on-click=\"{{ submit }}\" style=\"width:100%;height:58px;border:none;border-radius:16px;background:oklch(0.48 0.07 200);color:#fff;font:600 17px/1 'Public Sans',sans-serif;cursor:pointer\" style-hover=\"background:oklch(0.42 0.07 200)\">Submit<\u002Fbutton>\n  <button sc-camel-on-click=\"{{ submit }}\" style=\"margin-top:8px;width:100%;height:46px;border:none;background:none;color:#6E6A62;font:500 15px/1 'Public Sans',sans-serif;cursor:pointer;text-decoration:underline;text-underline-offset:3px\" style-hover=\"color:#23211D\">Skip this — just count my ranking<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ── THANKS ── -->\n<sc-if value=\"{{ isDone }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"flex:1;display:flex;flex-direction:column;padding:66px 22px 40px;animation:cvup .4s ease both\">\n  <div style=\"width:52px;height:52px;border-radius:50%;background:oklch(0.56 0.08 150);display:flex;align-items:center;justify-content:center\">\n    <span style=\"display:block;width:18px;height:10px;border-left:3px solid #fff;border-bottom:3px solid #fff;transform:rotate(-45deg) translate(1px,-2px)\"><\u002Fspan>\n  <\u002Fdiv>\n  <h2 style=\"margin:22px 0 0;font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-size:36px;line-height:1.06;color:#23211D\">Thanks — your voice is counted.<\u002Fh2>\n  <div style=\"margin:14px 0 0;display:flex;flex-wrap:wrap;gap:7px\">\n    <span style=\"padding:6px 11px;border-radius:100px;background:#EDE6DA;font:500 11px/1 'IBM Plex Mono',monospace;letter-spacing:.05em;color:#4A463E\">VIA {{ placeCode }}<\u002Fspan>\n    <span style=\"padding:6px 11px;border-radius:100px;background:#EDE6DA;font:500 11px/1 'IBM Plex Mono',monospace;letter-spacing:.05em;color:#4A463E\">{{ leaderCode }}<\u002Fspan>\n    <span style=\"padding:6px 11px;border-radius:100px;background:#EDE6DA;font:500 11px/1 'IBM Plex Mono',monospace;letter-spacing:.05em;color:#4A463E\">{{ whyTag }}<\u002Fspan>\n  <\u002Fdiv>\n\n  <div style=\"margin:24px 0 0;padding:20px 18px;border-radius:20px;background:#FFF;border:1px solid rgba(35,33,29,.1)\">\n    <div style=\"font-size:13.5px;color:#6E6A62;line-height:1.4\">Here's what {{ placeName }} visitors have said so far<\u002Fdiv>\n    <div style=\"margin-top:16px;display:flex;flex-direction:column;gap:14px\">\n      <sc-for list=\"{{ results }}\" as=\"r\" hint-placeholder-count=\"3\">\n        <div style=\"display:flex;flex-direction:column;gap:7px\">\n          <div style=\"display:flex;align-items:baseline;gap:8px\">\n            <span style=\"font:600 13px/1 'IBM Plex Mono',monospace;color:#A8A093;width:16px\">{{ r.pos }}<\u002Fspan>\n            <span style=\"flex:1;font-size:15px;font-weight:600;color:#23211D;letter-spacing:-.01em\">{{ r.title }}<\u002Fspan>\n            <span style=\"font:500 13px/1 'IBM Plex Mono',monospace;color:{{ r.countColor }}\">{{ r.count }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"height:9px;border-radius:100px;background:#F0EBE1;overflow:hidden\">\n            <div style=\"height:100%;border-radius:100px;transition:width .9s cubic-bezier(.2,.7,.2,1);background:{{ r.fill }};width:{{ r.width }}\"><\u002Fdiv>\n          <\u002Fdiv>\n          <sc-if value=\"{{ r.mine }}\" hint-placeholder-val=\"{{ false }}\">\n            <span style=\"font:500 10.5px/1 'IBM Plex Mono',monospace;letter-spacing:.06em;color:oklch(0.48 0.07 200);text-transform:uppercase\">Includes your vote<\u002Fspan>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"margin-top:18px;padding-top:14px;border-top:1px solid rgba(35,33,29,.08);display:flex;align-items:center;gap:8px;font:500 11.5px/1 'IBM Plex Mono',monospace;color:#8A8377\">\n      <span style=\"width:7px;height:7px;border-radius:50%;background:oklch(0.56 0.08 150)\"><\u002Fspan>{{ liveLabel }}\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"flex:1;min-height:20px\"><\u002Fdiv>\n  <button sc-camel-on-click=\"{{ next }}\" style=\"width:100%;height:58px;border:none;border-radius:16px;background:oklch(0.48 0.07 200);color:#fff;font:600 17px/1 'Public Sans',sans-serif;cursor:pointer\" style-hover=\"background:oklch(0.42 0.07 200)\">What happens next<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ── FEEDBACK LOOP ── -->\n<sc-if value=\"{{ isNext }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"flex:1;display:flex;flex-direction:column;padding:66px 22px 40px;animation:cvup .4s ease both\">\n  <h2 style=\"margin:0;font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-size:34px;line-height:1.08;color:#23211D\">We'll share what happens next.<\u002Fh2>\n  <p style=\"margin:12px 0 0;font-size:16px;line-height:1.5;color:#5E5A51;text-wrap:pretty\">{{ leaderName }} posts a summary on the {{ placeName }} board every month — and what changed because of it.<\u002Fp>\n\n  <div style=\"margin:24px 0 0;border-radius:20px;overflow:hidden;border:1px dashed rgba(35,33,29,.22);background:#FFF\">\n    <svg sc-camel-view-box=\"0 0 340 150\" width=\"100%\" style=\"display:block;background:#F4EFE5\">\n      <defs><pattern id=\"cvstripe\" width=\"10\" height=\"10\" sc-camel-pattern-transform=\"rotate(45)\" sc-camel-pattern-units=\"userSpaceOnUse\"><rect width=\"10\" height=\"10\" fill=\"#F4EFE5\"><\u002Frect><rect width=\"4\" height=\"10\" fill=\"#EAE2D3\"><\u002Frect><\u002Fpattern><\u002Fdefs>\n      <rect width=\"340\" height=\"150\" fill=\"url(#cvstripe)\"><\u002Frect>\n    <\u002Fsvg>\n    <div style=\"padding:14px 16px;font:500 11px/1.5 'IBM Plex Mono',monospace;letter-spacing:.05em;color:#7C766B;text-transform:uppercase\">Placeholder — monthly “you said / we did” update card<\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"margin:16px 0 0;display:flex;flex-direction:column;gap:10px\">\n    <div style=\"display:flex;gap:12px;padding:15px 16px;border-radius:16px;background:#FFF;border:1px solid rgba(35,33,29,.1);align-items:center\">\n      <span style=\"width:10px;height:10px;flex:none;border-radius:2px;background:oklch(0.72 0.11 75);transform:rotate(45deg)\"><\u002Fspan>\n      <span style=\"font-size:14.5px;line-height:1.4;color:#5E5A51\">Next posting: <strong style=\"color:#23211D;font-weight:600\">Sept 1<\u002Fstrong>, front entrance &amp; website<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"flex:1;min-height:20px\"><\u002Fdiv>\n  <button sc-camel-on-click=\"{{ restart }}\" style=\"width:100%;height:58px;border:none;border-radius:16px;background:#23211D;color:#fff;font:600 17px/1 'Public Sans',sans-serif;cursor:pointer\" style-hover=\"background:#38352E\">Done<\u002Fbutton>\n  <p style=\"margin:14px 0 0;text-align:center;font-size:12.5px;color:#8A8377\">Screen resets for the next person automatically<\u002Fp>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"max-width:420px;text-align:center;font-size:12.5px;line-height:1.5;color:#6E6A62\">{{ caption }}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;leaderName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Ms. Alvarez&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Content&quot;},&quot;placeName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Central Library&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Content&quot;},&quot;showPairPrompt&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Flow&quot;}}\">\nconst TEAL = 'oklch(0.48 0.07 200)', MOSS = 'oklch(0.56 0.08 150)', OCHRE = 'oklch(0.72 0.11 75)';\n\nconst ISSUES = [\n  { key: 'hours', title: 'Library hours & programming', sub: 'Evenings, weekends, classes', base: 128, shape: { radius: '3px', fill: TEAL, rot: '0deg' } },\n  { key: 'youth', title: 'Youth activities', sub: 'After school, teens, sports', base: 96, shape: { radius: '50%', fill: MOSS, rot: '0deg' } },\n  { key: 'safety', title: 'Safety & lighting', sub: 'Walking home, crossings', base: 84, shape: { radius: '2px', fill: 'none', rot: '45deg', border: '2.5px solid ' + TEAL } },\n  { key: 'housing', title: 'Housing costs', sub: 'Rent, first homes, seniors', base: 71, shape: { radius: '3px 3px 3px 12px', fill: OCHRE, rot: '0deg' } },\n  { key: 'green', title: 'Parks & green space', sub: 'Trees, trails, playgrounds', base: 63, shape: { radius: '50% 50% 50% 2px', fill: MOSS, rot: '0deg' } },\n  { key: 'business', title: 'Local business support', sub: 'Main street, storefronts', base: 47, shape: { radius: '100px', fill: OCHRE, rot: '0deg' } },\n];\n\nconst STEPS = ['welcome', 'pick', 'pair', 'why', 'done', 'next'];\n\nclass Component extends DCLogic {\n  state = { step: 0, picks: [], why: '', pairDismissed: false, bump: 0, grown: false, tick: 0, voice: 'idle', recSecs: 0 };\n\n  startRec = () => {\n    this.setState({ voice: 'recording', recSecs: 0 });\n    clearInterval(this._r);\n    this._r = setInterval(() => this.setState(s => (s.recSecs >= 30 ? (clearInterval(this._r), { voice: 'done' }) : { recSecs: s.recSecs + 1 })), 1000);\n  };\n  stopRec = () => { clearInterval(this._r); this.setState(s => ({ voice: s.recSecs > 0 ? 'done' : 'idle' })); };\n  clearRec = () => { clearInterval(this._r); this.setState({ voice: 'idle', recSecs: 0 }); };\n\n  componentDidUpdate(_, prev) {\n    if (prev.step !== this.state.step && STEPS[this.state.step] === 'done') {\n      clearTimeout(this._g);\n      this._g = setTimeout(() => this.setState({ grown: true }), 60);\n      clearInterval(this._i);\n      this._i = setInterval(() => this.setState(s => ({ tick: s.tick + 1, bump: s.bump + (Math.random() < 0.55 ? 1 : 0) })), 3200);\n    }\n    if (prev.step !== this.state.step && STEPS[this.state.step] !== 'done') clearInterval(this._i);\n  }\n  componentWillUnmount() { clearInterval(this._i); clearTimeout(this._g); }\n\n  go = d => this.setState(s => {\n    let n = s.step + d;\n    if (STEPS[n] === 'pair' && s.pairDismissed) n += d > 0 ? 1 : -1;\n    return { step: Math.max(0, Math.min(STEPS.length - 1, n)), grown: false };\n  });\n\n  pick = key => this.setState(s => {\n    const i = s.picks.indexOf(key);\n    if (i > -1) return { picks: s.picks.filter(k => k !== key) };\n    if (s.picks.length >= 3) return null;\n    return { picks: [...s.picks, key] };\n  });\n\n  dots(active) {\n    const items = [0, 1, 2, 3].map(i => React.createElement('span', { key: i, style: {\n      height: 3, flex: 1, borderRadius: 100, background: i <= active ? TEAL : 'rgba(35,33,29,.13)',\n      transition: 'background .3s',\n    } }));\n    return items;\n  }\n\n  renderVals() {\n    const s = this.state, step = STEPS[s.step];\n    const leaderName = this.props.leaderName ?? 'Ms. Alvarez';\n    const placeName = this.props.placeName ?? 'Central Library';\n    const showPair = (this.props.showPairPrompt ?? true);\n    const picks = s.picks;\n\n    const issues = ISSUES.map(it => {\n      const rank = picks.indexOf(it.key) + 1;\n      const on = rank > 0;\n      return {\n        title: it.title, sub: it.sub, pick: () => this.pick(it.key),\n        rankLabel: on ? String(rank) : '',\n        bg: on ? '#FFFDF8' : '#FFF',\n        border: on ? TEAL : 'rgba(35,33,29,.11)',\n        iconBg: on ? '#E6EDEF' : '#F1ECE2',\n        iconFill: it.shape.fill, iconBorder: it.shape.border || 'none',\n        iconRadius: it.shape.radius, iconRot: it.shape.rot,\n        badgeBg: on ? TEAL : 'transparent',\n        badgeBorder: on ? 'none' : '1.5px dashed rgba(35,33,29,.18)',\n      };\n    });\n\n    const counted = ISSUES.map((it, i) => {\n      const mineRank = picks.indexOf(it.key);\n      const mine = mineRank > -1;\n      const extra = mine ? [3, 2, 1][mineRank] : 0;\n      const drift = Math.floor(s.bump * (i === 0 ? 0.6 : i === 1 ? 0.3 : 0.12));\n      return { ...it, mine, count: it.base + extra + drift };\n    }).sort((a, b) => b.count - a.count);\n    const max = counted[0] ? counted[0].count : 1;\n    const results = counted.slice(0, 3).map((r, i) => ({\n      pos: String(i + 1), title: r.title, count: r.count, mine: r.mine,\n      countColor: r.mine ? TEAL : '#7C766B',\n      fill: r.mine ? TEAL : 'rgba(35,33,29,.22)',\n      width: s.grown ? Math.round((r.count / max) * 100) + '%' : '4%',\n    }));\n\n    const topIssue = ISSUES.find(i => i.key === picks[0]);\n\n    return {\n      leaderName, placeName,\n      placeCode: placeName.toUpperCase(),\n      leaderCode: 'ENDORSED BY ' + leaderName.toUpperCase(),\n      whyTag: s.voice === 'done' ? 'WITH A VOICE NOTE' : (s.why.trim() ? 'WITH A NOTE' : 'RANKING ONLY'),\n      isWelcome: step === 'welcome', isPick: step === 'pick', isPair: step === 'pair' && showPair,\n      isWhy: step === 'why', isDone: step === 'done', isNext: step === 'next',\n      issues,\n      pickHint: picks.length === 0 ? 'Pick three — your first tap counts most.' : picks.length + ' of 3 chosen · tap again to undo',\n      pickIncomplete: picks.length < 3,\n      ctaLabel: picks.length < 3 ? 'Choose ' + (3 - picks.length) + ' more' : 'Continue',\n      ctaBg: picks.length < 3 ? '#E7E1D6' : TEAL,\n      ctaColor: picks.length < 3 ? '#9A9284' : '#fff',\n      dotsA: this.dots(0), dotsB: this.dots(1), dotsC: this.dots(2),\n      topPick: topIssue ? topIssue.title.toLowerCase() : 'your top issue',\n      why: s.why,\n      setWhy: e => this.setState({ why: e.target.value }),\n      whyCount: s.why.length ? s.why.length + ' characters' : 'Optional',\n      voiceIdle: s.voice === 'idle', voiceRecording: s.voice === 'recording', voiceDone: s.voice === 'done',\n      recTime: '0:' + String(s.recSecs).padStart(2, '0'),\n      bars: [7,13,20,11,26,16,9,22,14,28,12,18,24,10,16,21,8,15].map((h, i) => ({ h: h + 'px', d: (i % 6) * 0.11 + 's' })),\n      startRec: this.startRec, stopRec: this.stopRec, clearRec: this.clearRec,\n      liveLabel: 'Updating live · ' + (counted.reduce((n, r) => n + r.count, 0)) + ' voices at this location',\n      results,\n      start: () => this.go(1),\n      next: () => this.go(1),\n      submit: () => this.go(1),\n      dismissPair: () => this.setState({ pairDismissed: true, step: STEPS.indexOf('why') }),\n      restart: () => { clearInterval(this._r); this.setState({ step: 0, picks: [], why: '', pairDismissed: false, grown: false, bump: 0, voice: 'idle', recSecs: 0 }); },\n      caption: 'Tap through the flow: endorsement → rank three issues → optional note → live location results. Every submission is tagged to its QR poster and the leader who endorsed it.',\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
