document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;

            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

r-neutral-200: #eee7db;\n  --color-neutral-300: #dcd3c4;\n  --color-neutral-400: #c0b6a5;\n  --color-neutral-500: #a19786;\n  --color-neutral-600: #82796a;\n  --color-neutral-700: #645c50;\n  --color-neutral-800: #474238;\n  --color-neutral-900: #2e2b25;\n\n  --color-accent-100: #fff2eb;\n  --color-accent-200: #ffe1d0;\n  --color-accent-300: #ffc6a5;\n  --color-accent-400: #f6a06b;\n  --color-accent-500: #d67f48;\n  --color-accent-600: #b2622d;\n  --color-accent-700: #8c491a;\n  --color-accent-800: #643312;\n  --color-accent-900: #402310;\n\n  --color-accent-2-100: #f0fae1;\n  --color-accent-2-200: #e1eecc;\n  --color-accent-2-300: #ccdbb2;\n  --color-accent-2-400: #aebf92;\n  --color-accent-2-500: #8fa073;\n  --color-accent-2-600: #728157;\n  --color-accent-2-700: #56633f;\n  --color-accent-2-800: #3d472b;\n  --color-accent-2-900: #272e1b;\n\n  --font-heading: \"Caprasimo\", system-ui, sans-serif;\n  --font-heading-weight: 400;\n  --font-body: \"Figtree\", system-ui, sans-serif;\n\n  --space-1: 4.4px;\n  --space-2: 8.8px;\n  --space-3: 13.2px;\n  --space-4: 17.6px;\n  --space-6: 26.4px;\n  --space-8: 35.2px;\n\n  --radius-sm: 8px;\n  --radius-md: 16px;\n  --radius-lg: 28px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2e2b25 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2e2b25 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2e2b25 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.washed{filter:saturate(0.6) contrast(0.85) brightness(1.1) opacity(0.94)}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: none;\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 1px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid color-mix(in srgb, var(--color-text) 8%, transparent);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n/* — rounded frame: everything softens, small controls go pill — */\n.card, .dialog { border-radius: calc(var(--radius-lg) * 1.15); }\n.btn, .tag, .seg, .input { border-radius: 999px; }\n.input { padding-inline: 14px; }\n\n<\u002Fstyle>\n<script src=\"22cb53b6-6b09-47bb-a812-d99cc3884e03\"><\u002Fscript>\n<style>\n  body { margin: 0; }\n  @keyframes riseIn { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: none } }\n  @keyframes plotOpen { from { opacity: 0; transform: scale(.7) } to { opacity: 1; transform: none } }\n  @keyframes lidOff { from { opacity: 1; transform: none } to { opacity: 0; transform: translateY(-46px) rotate(-14deg) } }\n  @keyframes bob { 0%, 100% { transform: translateY(0) } 50% { transform: translateY(-3px) } }\n  @keyframes settle { 0% { transform: translateY(-10px) } 60% { transform: translateY(4px) } 100% { transform: none } }\n  a { color: var(--color-accent); }\n  a:hover { color: var(--color-accent-700); }\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"min-height: 100vh; background: var(--color-bg); color: var(--color-text); font-family: var(--font-body);\">\n\n  <div class=\"nav\" style=\"max-width: 1080px; margin: 0 auto; padding-top: var(--space-6);\">\n    <div class=\"nav-brand\" style=\"display: flex; align-items: center; gap: 10px;\">\n      <span style=\"width: 24px; height: 24px; border-radius: 999px; background: var(--color-accent); display: inline-block;\"><\u002Fspan>\n      Commons\n    <\u002Fdiv>\n    <a href=\"#\" sc-camel-on-click=\"{{ goDocket }}\" aria-current=\"{{ navDocket }}\">What's open<\u002Fa>\n    <a href=\"#\" sc-camel-on-click=\"{{ goTown }}\" aria-current=\"{{ navTown }}\">Your town<\u002Fa>\n    <span class=\"tag tag-accent-2\" style=\"margin-left: var(--space-2);\">{{ filedLabel }}<\u002Fspan>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ isWelcome }}\" hint-placeholder-val=\"{{ true }}\">\n    <main style=\"max-width: 1080px; margin: 0 auto; padding: var(--space-8) var(--space-4);\">\n      <div style=\"display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, .9fr); gap: var(--space-8); align-items: center;\">\n        <div>\n          <h6 style=\"color: var(--color-accent-700); margin-bottom: var(--space-3);\">A town built out of public comments<\u002Fh6>\n          <h1 style=\"font-size: 52px; max-width: 16ch; margin-bottom: var(--space-4);\">Say one true thing. Get a building.<\u002Fh1>\n          <p style=\"font-size: 17px; max-width: 46ch; opacity: .82;\">Right now, federal agencies are asking the public what they think about rules on water, school lunch, rent, dialysis. Hardly anyone answers — which means a few sentences from you genuinely counts. We give you the words to start from, and every comment you file puts something new on your map.<\u002Fp>\n          <div style=\"display: flex; flex-direction: column; gap: var(--space-4); max-width: 400px; margin-top: var(--space-6);\">\n            <div class=\"field\">\n              <label>What should we call your town?<\u002Flabel>\n              <input class=\"input\" placeholder=\"Marigold Flats\" value=\"{{ townDraft }}\" sc-camel-on-change=\"{{ setTownDraft }}\">\n            <\u002Fdiv>\n            <div class=\"field\">\n              <label>What's close to home for you?<\u002Flabel>\n              <div style=\"display: flex; flex-wrap: wrap; gap: var(--space-2); margin-top: 6px;\">\n                <sc-for list=\"{{ interestChips }}\" as=\"c\" hint-placeholder-count=\"6\">\n                  <button class=\"{{ c.cls }}\" sc-camel-on-click=\"{{ c.toggle }}\" style=\"cursor: pointer; padding: 7px 15px; font-family: var(--font-body); font-size: 13px; border-style: solid; border-width: 1px;\">{{ c.label }}<\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <button class=\"btn btn-primary\" sc-camel-on-click=\"{{ startGame }}\" style=\"padding: 13px 24px; font-size: 15px; align-self: flex-start;\">Break ground →<\u002Fbutton>\n            <span class=\"text-muted\" style=\"font-size: 12px;\">Takes about four minutes for your first one. No account, no experience needed.<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"position: relative; height: 420px;\">\n          <span style=\"position: absolute; left: 10%; top: 4%; width: 210px; height: 210px; border-radius: 999px; background: var(--color-accent-2-200);\"><\u002Fspan>\n          <span style=\"position: absolute; right: 0; top: 38%; width: 160px; height: 160px; border-radius: 999px; background: var(--color-accent-200);\"><\u002Fspan>\n          <span style=\"position: absolute; left: 26%; bottom: 0; width: 130px; height: 130px; border-radius: 999px; background: var(--color-neutral-300);\"><\u002Fspan>\n          <div class=\"card elev-lg\" style=\"position: absolute; left: 0; top: 26%; width: 268px; background: var(--color-neutral-100);\">\n            <span class=\"card-kicker\">HHS · closes in 24 days<\u002Fspan>\n            <span class=\"card-title\">Medicare coverage for at‑home dialysis<\u002Fspan>\n            <p class=\"card-body\">1,205 people have commented. CMS asked specifically to hear from patients and the people who drive them.<\u002Fp>\n            <div class=\"card-meta\"><span class=\"tag tag-accent\">Builds a dialysis center<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"card elev-md\" style=\"position: absolute; right: 4%; bottom: 8%; width: 210px;\">\n            <span class=\"card-kicker\">Your town<\u002Fspan>\n            <span class=\"card-title\" style=\"font-size: 15px;\">4 buildings · 3 rules still moving<\u002Fspan>\n            <div style=\"display: flex; gap: 6px; color: var(--color-accent-800);\">\n              <svg sc-camel-view-box=\"0 0 24 24\" width=\"30\" height=\"30\"><path d=\"M4.5 20V8.6A1.6 1.6 0 016.1 7h7.8a1.6 1.6 0 011.6 1.6V20zM16.5 20v-6.5h3.2V20z\" fill=\"currentColor\"><\u002Fpath><\u002Fsvg>\n              <svg sc-camel-view-box=\"0 0 24 24\" width=\"30\" height=\"30\"><path d=\"M2.5 20v-7.5h12V20zM14.5 20v-5.5h6V20zM10.9 12.5v-4h2.2v4z\" fill=\"currentColor\"><\u002Fpath><\u002Fsvg>\n              <svg sc-camel-view-box=\"0 0 24 24\" width=\"30\" height=\"30\"><path d=\"M8.4 20 11.4 5.4h1.3L15.7 20zM16.6 20v-4.6h4V20z\" fill=\"currentColor\"><\u002Fpath><\u002Fsvg>\n              <svg sc-camel-view-box=\"0 0 24 24\" width=\"30\" height=\"30\"><path d=\"M11.2 20h1.7v-4.4h-1.7zM6.2 17.2 9.6 11.6l3.4 5.6zM12.9 14.2l3.3-5.6 3.3 5.6z\" fill=\"currentColor\"><\u002Fpath><\u002Fsvg>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fmain>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isDocket }}\" hint-placeholder-val=\"{{ true }}\">\n    <main style=\"max-width: 1080px; margin: 0 auto; padding: var(--space-6) var(--space-4) var(--space-8);\">\n      <h1 style=\"font-size: 40px; margin-bottom: var(--space-2);\">Open right now<\u002Fh1>\n      <p style=\"max-width: 58ch; opacity: .78;\">These are real kinds of rules, taking comment today. Pick whichever one you'd actually have something to say about — that's the whole trick.<\u002Fp>\n      <div style=\"display: flex; flex-wrap: wrap; gap: var(--space-2); margin: var(--space-4) 0 var(--space-6);\">\n        <sc-for list=\"{{ topicChips }}\" as=\"c\" hint-placeholder-count=\"6\">\n          <button class=\"{{ c.cls }}\" sc-camel-on-click=\"{{ c.pick }}\" style=\"cursor: pointer; padding: 7px 16px; font-family: var(--font-body); font-size: 13px; border-style: solid; border-width: 1px;\">{{ c.label }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ questCards }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: var(--space-4);\">\n          <sc-for list=\"{{ visibleDockets }}\" as=\"d\" hint-placeholder-count=\"6\">\n            <div class=\"card elev-sm\" style=\"gap: var(--space-3); padding: var(--space-4);\">\n              <div style=\"display: flex; align-items: baseline; justify-content: space-between; gap: var(--space-2);\">\n                <span class=\"card-kicker\">{{ d.agency }}<\u002Fspan>\n                <span class=\"tag tag-neutral\">{{ d.closes }}<\u002Fspan>\n              <\u002Fdiv>\n              <span class=\"card-title\" style=\"font-size: 21px;\">{{ d.title }}<\u002Fspan>\n              <p class=\"card-body\">{{ d.summary }}<\u002Fp>\n              <div style=\"display: flex; align-items: center; gap: 10px; padding-top: var(--space-3); border-top: 1px solid var(--color-divider);\">\n                <span style=\"width: 40px; height: 40px; flex: none; border-radius: 999px; background: var(--color-accent-2-200); color: var(--color-accent-2-800); display: grid; place-items: center;\">\n                  <svg sc-camel-view-box=\"0 0 24 24\" width=\"26\" height=\"26\" style=\"margin-top: 2px;\"><path d=\"{{ d.bodyPath }}\" fill=\"currentColor\"><\u002Fpath><path d=\"{{ d.detailPath }}\" fill=\"none\" stroke=\"var(--color-accent-2-100)\" stroke-width=\"1.5\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>\n                <\u002Fspan>\n                <span style=\"font-size: 13px; line-height: 1.35;\">Builds <strong>{{ d.reward }}<\u002Fstrong><br><span class=\"text-muted\" style=\"font-size: 11px;\">{{ d.effort }}<\u002Fspan><\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display: flex; align-items: center; gap: var(--space-2);\">\n                <button class=\"btn btn-primary\" sc-camel-on-click=\"{{ d.open }}\" disabled=\"{{ d.built }}\">{{ d.cta }}<\u002Fbutton>\n                <sc-if value=\"{{ d.built }}\" hint-placeholder-val=\"{{ false }}\">\n                  <button class=\"btn btn-ghost\" sc-camel-on-click=\"{{ d.visit }}\">Visit it →<\u002Fbutton>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ questList }}\" hint-placeholder-val=\"{{ false }}\">\n        <div class=\"card elev-sm\" style=\"padding: var(--space-2) var(--space-4); gap: 0;\">\n          <sc-for list=\"{{ visibleDockets }}\" as=\"d\" hint-placeholder-count=\"6\">\n            <div style=\"{{ d.rowStyle }}\">\n              <span style=\"width: 44px; height: 44px; flex: none; border-radius: 999px; background: var(--color-accent-2-200); color: var(--color-accent-2-800); display: grid; place-items: center;\">\n                <svg sc-camel-view-box=\"0 0 24 24\" width=\"28\" height=\"28\" style=\"margin-top: 2px;\"><path d=\"{{ d.bodyPath }}\" fill=\"currentColor\"><\u002Fpath><path d=\"{{ d.detailPath }}\" fill=\"none\" stroke=\"var(--color-accent-2-100)\" stroke-width=\"1.5\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>\n              <\u002Fspan>\n              <div style=\"min-width: 0;\">\n                <span style=\"font-family: var(--font-heading); font-size: 17px;\">{{ d.title }}<\u002Fspan>\n                <p class=\"text-muted\" style=\"font-size: 12px; margin: 3px 0 0;\">{{ d.agency }} · {{ d.closes }} · builds {{ d.reward }}<\u002Fp>\n              <\u002Fdiv>\n              <button class=\"btn btn-primary\" sc-camel-on-click=\"{{ d.open }}\" disabled=\"{{ d.built }}\" style=\"margin-left: auto; flex: none;\">{{ d.cta }}<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fmain>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isCompose }}\" hint-placeholder-val=\"{{ false }}\">\n    <main style=\"max-width: 1080px; margin: 0 auto; padding: var(--space-4) var(--space-4) var(--space-8);\">\n      <button class=\"btn btn-ghost\" sc-camel-on-click=\"{{ goDocket }}\" style=\"margin-bottom: var(--space-3);\">← Never mind, show me others<\u002Fbutton>\n      <div style=\"display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, .8fr); gap: var(--space-6); align-items: start;\">\n        <div>\n          <span class=\"card-kicker\">{{ current.agency }} · {{ current.id }}<\u002Fspan>\n          <h1 style=\"font-size: 33px; margin: var(--space-2) 0 var(--space-3);\">{ solid var(--color-divider); padding-top: var(--space-2);\">\n              <span>{{ wordCount }} words<\u002Fspan>\n              <span class=\"tag tag-outline\">{{ current.id }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"card\" style=\"gap: var(--space-3); background: var(--color-accent-100);\">\n            <span class=\"card-kicker\">Filing it<\u002Fspan>\n            <p class=\"card-body\" style=\"font-size: 13px; opacity: .95;\">Only regulations.gov can take it officially — copy your words, paste them there, then come back and tell us you did.<\u002Fp>\n            <div style=\"display: flex; gap: var(--space-2); flex-wrap: wrap;\">\n              <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ copyComment }}\" disabled=\"{{ notReady }}\">{{ copyLabel }}<\u002Fbutton>\n              <a class=\"btn btn-primary\" href=\"{{ current.url }}\" target=\"_blank\" rel=\"noopener\">Go straight to the comment box ↗<\u002Fa>\n            <\u002Fdiv>\n            <label class=\"radio\" style=\"align-items: flex-start; gap: 10px; margin-top: var(--space-2);\">\n              <input type=\"checkbox\" checked=\"{{ confirmed }}\" sc-camel-on-change=\"{{ toggleConfirm }}\">\n              <span class=\"dot\" style=\"margin-top: 3px;\"><\u002Fspan>\n              <span style=\"font-size: 13px;\">I filed this comment, in my own words.<\u002Fspan>\n            <\u002Flabel>\n            <button class=\"btn btn-primary btn-block\" sc-camel-on-click=\"{{ claim }}\" disabled=\"{{ claimBlocked }}\" style=\"padding: 12px;\">{{ claimLabel }}<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fmain>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isReward }}\" hint-placeholder-val=\"{{ false }}\">\n    <main style=\"max-width: 720px; margin: 0 auto; padding: var(--space-8) var(--space-4); text-align: center;\">\n      <div style=\"animation: riseIn .5s ease both;\">\n        <h6 style=\"color: var(--color-acc n};\n\nconst DOCKETS = [\n  { id: \"EPA-HQ-OW-2026-0233\", agency: \"EPA\", topic: \"Water\", closes: \"Closes in 14 days\",\n    title: \"Deadline for pulling out lead water pipes\",\n    summary: \"Utilities would get ten years to replace every lead service line. Small systems are asking for longer.\",\n    detail: \"The rule sets the replacement deadline, decides who pays for the pipe on your side of the property line, and says how much warning a household gets before their water is disturbed. The agency has plenty of comments from utilities and almost none from people who drink the water.\",\n    effort: \"About 3 minutes · 1,847 comments so far\",\n    reward: \"the Waterworks\", icon: \"water\", col: 1, row: 2, status: \"Comment period closed · under review\",\n    rewardNote: \"A pumphouse at the creek. The least glamorous, most necessary thing a town owns.\",\n    next: \"EPA has to respond to substantive comments before it finalizes. Expect a final rule in the spring.\",\n    prompts: [\n      { label: \"Who are you, and where?\", hint: \"One line. Comments from affected residents get weighed differently.\", starter: \"I rent a 1940s duplex in Toledo, Ohio, on a street with lead service lines.\" },\n      { label: \"What have you actually seen?\", hint: \"Specifics beat outrage — dates, costs, what you were told.\", starter: \"Our water ran rust-brown for three days after the city dug up the street, and nobody told us it was coming.\" },\n      { label: \"What should the rule say instead?\", hint: \"Name one thing you'd change.\", starter: \"Keep the ten-year deadline, and require 72 hours of written notice before any line is disturbed.\" }\n    ],\n    updates: [\n      { date: \"Jun 2, 2026\", label: \"Rule proposed\", note: \"EPA published the proposal and opened a 60-day comment window.\" },\n      { date: \"Aug 12, 2026\", label: \"You commented\", note: \"Your comment was accepted into the public docket.\" },\n      { date: \"Aug 28, 2026\", label: \" led with the parent-perspective evidence the notice asked for.\" },\n      { date: \"Sep 15, 2026\", label: \"Comment period closes\", note: \"Still open — you can send a second comment on a different provision.\" }\n    ] },\n  { id: \"CMS-2026-0041\", agency: \"HHS\", topic: \"Health\", closes: \"Closes in 24 days\",\n    title: \"Medicare coverage for at-home dialysis\",\n    summary: \"Pays for home-dialysis training and adds remote monitoring for patients far from a center.\",\n    detail: \"CMS proposes covering up to fifteen training sessions and remote monitoring where the nearest center is over 45 minutes away. The distance threshold, the session count, and who counts as a caregiver are all listed in the notice as open questions — which is an invitation.\",\n    effort: \"About 4 minutes · 1,205 comments so far\",\n    reward: \"the Dialysis Center\", icon: \"hospital\", col: 2, row: 3, status: \"Open for comment\",\n    rewardNote: \"Four chairs and big windows, and nobody driving two hours each way, three times a week.\",\n    next: \"CMS folds this into the annual payment rule in November. Comments on the 45-minute threshold are the ones being counted.\",\n    prompts: [\n      { label: \"Who are you, and where?\", hint: \"Patients and caregivers are exactly who CMS asked for.\", starter: \"I care for my father, who is on dialysis in rural Vermont.\" },\n      { label: \"What have you actually seen?\", hint: \"Distance, hours, missed work, what it costs you.\", starter: \"The nearest center is 70 minutes away. We drive it three times a week and he sleeps the whole way home.\" },\n      { label: \"What should the rule say instead?\", hint: \"Pick one number in the rule and move it.\", starter: \"Lower the rural threshold from 45 minutes to 30, and count unpaid family caregivers as trainable.\" }\n    ],\n    updates: [\n      { date: \"Jul 8, 2026\", label: \"Rule proposed\", note: \"Published with three questions flagged for public input.\" },\n      { date: \"Aug 14, 2026\", label: \"You commented\", note: \"Your account of the drive is now in the public record, quotable by name or anonymously.\" },\n      { date: \"Sep 8, 2026\", label: \"Comment period closes\", note: \"Still open.\" },\n      { date: \"Nov 2026\", label: \"Final payment rule\", note: \"Where this either lands or doesn't.\" }\n    ] },\n  { id: \"HUD-2026-0044\", agency: \"HUD\", topic: \"Housing\", closes: \"Closes in 7 days\",\n    title: \"Step-free units in new federally funded apartments\",\n    summary: \"Doubles the share of adaptable units, and adds a bathroom turning-space standard.\",\n    detail: \"The proposal moves adaptable-unit requirements from 5% to 10% in federally assisted construction. Developers have commented heavily about cost. Almost nobody who actually uses a wheelchair has commented at all.\",\n    effort: \"About 3 minutes · 690 comments so far\",\n    reward: \"Sunrise Apartments\", icon: \"housing\", col: 0, row: 1, status: \"Comment period closed · under review\",\n    rewardNote: \"Twelve units, step-free, with doorways a chair fits through. The plainest kind of good.\",\n    next: \"HUD is reviewing. Because the record was thin, individual comments here carry more weight than usual.\",\n    prompts: [\n      { label: \"Who are you, and where?\", hint: \"Lived experience is the exact gap in this record.\", starter: \"I use a power chair and have been apartment hunting in Atlanta for eight months.\" },\n      { label: \"What have you actually seen?\", hint: \"Counts and searches are evidence. Use them.\", starter: \"Of forty listings I toured, two had step-free entries, and neither had a bathroom I could turn around in.\" },\n      { label: \"What should the rule say instead?\", hint: \"One provision, one change.\", starter: \"Adopt the 10% requirement, and apply the turning-space standard to gut renovations as well.\" }\n    ],\n    updates: [\n      { date: \"May 22, 2026\", label: \"Rule proposed\", note: \"A 90- "Jul 30, 2026\", label: \"Rule proposed\", note: \"Comment and reply-comment rounds opened.\" },\n      { date: \"Aug 14, 2026\", label: \"You commented\", note: \"Attached speed-test evidence — the kind the Commission cites.\" },\n      { date: \"Sep 2, 2026\", label: \"Comment period closes\", note: \"Still open.\" }\n    ] },\n  { id: \"FTA-2026-0091\", agency: \"DOT\", topic: \"Transit\", closes: \"Closes in 21 days\",\n    title: \"Bus stop accessibility on federally funded routes\",\n    summary: \"Requires a landing pad, shelter, and lighting standard at newly built or rebuilt stops.\",\n    detail: \"Transit agencies are asking for a waiver where sidewalks don't exist. Riders who wait at those stops know exactly what standing in gravel in the dark is like, and that has not been described in the docket yet.\",\n    effort: \"About 3 minutes · 538 comments so far\",\n    reward: \"the Bus Shelter\", icon: \"bus\", col: 1, row: 0, status: \"Open for comment\",\n    rewardNote: \"A roof, a bench, and a light. Somehow still a policy question.\",\n    next: \"FTA has signaled it may split the shelter and lighting requirements. Comments naming one of them help.\",\n    prompts: [\n      { label: \"Who are you, and where?\", hint: \"Say which route you ride.\", starter: \"I ride the 14 to work in Tucson, and wait at a stop with no sidewalk.\" },\n      { label: \"What have you actually seen?\", hint: \"Weather, dark, mud, the wheelchair that can't board.\", starter: \"In July the stop is bare gravel with no shade, and in winter I wait in the dark on the shoulder.\" },\n      { label: \"What should the rule say instead?\", hint: \"Keep the shelter and the light together, or pick one.\", starter: \"Keep shelter and lighting in the same requirement, and don't waive it where sidewalks are missing.\" }\n    ],\n    updates: [\n      { date: \"Jul 24, 2026\", label: \"Rule proposed\", note: \"A 60-day comment window opened.\" },\n      { date: \"Aug 14, 2026\", label: \"You commented\", note: \"First rider account of an unpaved stop in this docket.\" },\n      { date: \"Sep 4, 2026\", label: \"Comment period closes\", note: \"Still open.\" }\n    ] }\n];\n\nconst KEYS = {};\nconst AV = { x: 350, y: 70, facing: 1 };\n\nconst TOPICS = [\"Water\", \"Schools\", \"Health\", \"Housing\", \"Internet\", \"Transit\"];\nconst POOL = [\"water\", \"school\", \"hospital\", \"housing\", \"tower\", \"bus\", \"park\", \"library\"];\n\nclass Component extends DCLogic {\n  state = {\n    screen: \"welcome\", townDraft: \"\", townName: \"Marigold Flats\",\n    interests: [\"Health\", \"Housing\"], filter: \"All\",\n    currentId: null, drafts: {}, confirmed: false, copied: false,\n    built: [], focusId: null, spinning: false, spinIcon: \"water\", revealed: false, read: [],\n    pos: {}, dragId: null, moved: false\n  };\n\n  gridRef = React.createRef();\n  avatarRef = React.createRef();\n\n  toTile(x, y) {\n    const dx = (x - 350) / 66, dy = (y - 70) / 38;\n    return { col: (dy + dx) / 2, row: (dy - dx) / 2 };\n  }\n  toScreen(col, row) {\n    return { x: 350 + (col - row) * 66, y: 70 + (col + row) * 38 };\n  }\n\n  componentDidMount() {\n    const h = (typeof location !== \"undefined\" ? location.hash : \"\").replace(\"#\", \"\");\n    if (h === \"docket\") this.setState({ screen: \"docket\" });\n    if (h === \"compose\") {\n      const id = DOCKETS[2].id;\n      this.setState({ screen: \"compose\", currentId: id, drafts: { [id]: DOCKETS[2].prompts.map(p => p.starter) } });\n    }\n    if (h === \"town\" || h === \"building\") {\n      const seeded = [DOCKETS[0].id, DOCKETS[2].id, DOCKETS[3].id, DOCKETS[5].id];\n      this.setState({ screen: h, built: seeded, focusId: DOCKETS[2].id, read: [DOCKETS[0].id] });\n    }\n    this.onKeyDown = (e) => {\n      const t = e.target && e.target.tagName;\n      if (t === \"INPUT\" || t === \"TEXTAREA\") return;\n      const k = e.key.toLowerCase();\n      const walk = { arrowup: \"u\", w: \"u\", arrowdown: \"d\", s: \"d\", arrowleft: \"l\", a: \"l\", arrowright: \"r\", d: \"r\" };\n      if (walk[k]) { KEYS[walk[k]] = true; e.preventDefault(); }\n      if ((k === \"enter\" || k === \" \") && this.state.screen === \"town\" && this.state.near) {\n        e.preventDefault(); this.visitBuilding(this.state.near);\n      }\n    };\n    this.onKeyUp = (e) => {\n      const k = e.key.toLowerCase();\n      const walk = { arrowup: \"u\", w: \"u\", arrowdown: \"d\", s: \"d\", arrowleft: \"l\", a: \"l\", arrowright: \"r\", d: \"r\" };\n      if (walk[k]) KEYS[walk[k]] = false;\n    };\n    window.addEventListener(\"keydown\", this.onKeyDown);\n    window.addEventListener(\"keyup\", this.onKeyUp);\n    this.timer = setInterval(this.step, 32);\n  }\n\n  step = () => {\n    if (this.state.screen !== \"town\") return;\n    const vx = (KEYS.r ? 1 : 0) - (KEYS.l ? 1 : 0);\n    const vy = (KEYS.d ? 1 : 0) - (KEYS.u ? 1 : 0);\n    if (vx || vy) {\n      const n = Math.hypot(vx, vy) || 1;\n      const t = this.toTile(AV.x + (vx / n) * 5.4, AV.y + (vy / n) * 3.2);\n      const col = Math.max(-0.35, Math.min(3.35, t.col)), row = Math.max(-0.35, Math.min(3.35, t.row));\n      const p = this.toScreen(col, row);\n      AV.x = p.x; AV.y = p.y; AV.facing = vx < 0 ? -1 : vx > 0 ? 1 : (AV.facing || 1);\n    }\n    const el = this.avatarRef.current;\n    const here = this.toTile(AV.x, AV.y);\n    if (el) {\n      el.style.left = AV.x + \"px\";\n      el.style.top = AV.y + \"px\";\n      el.style.zIndex = Math.round(14 + (here.col + here.row) * 4);\n      el.style.transform = \"translate(-50%,-100%) scaleX(\" + (AV.facing === -1 ? -1 : 1) + \")\";\n      const svg = el.firstElementChild;\n      const want = (vx || vy) ? \"bob .34s linear infinite\" : \"none\";\n      if (svg && el.dataset.anim !== want) { svg.style.animation = want; el.dataset.anim = want; }\n    }\n    let near = null, best = 0.95;\n    for (const id of this.state.built) {\n      const sp = this.spot(id);\n      const dist = Math.hypot(sp.col - here.col, sp.row - here.row);\n      if (dist < best) { best = dist; near = id; }\n    }\n    if (near !== this.state.near) this.setState({ near });\n  };\n\n  tileAt(e) {\n    const r = this.gridRef.current.getBoundingClientRect();\n    const dx = (e.clientX - r.left - 350) / 66, dy = (e.clientY - r.top - 70 + 26) / 38;\n    return {\n      col: Math.max(0, Math.min(3, Math.round((dy + dx) / 2))),\n      row: Math.max(0, Math.min(3, Math.round((dy - dx) / 2)))\n    };\n  }\n\n  onGridMove = (e) => {\n    const id = this.state.dragId;\n    if (!id || !this.gridRef.current) return;\n    const t = this.tileAt(e);\n    const taken = this.state.built.some(o => o !== id && this.spot(o).col === t.col && this.spot(o).row === t.row);\n    if (taken) return;\n    const cur = this.spot(id);\n    if (cur.col === t.col && cur.row === t.row) return;\n    this.setState({ pos: { ...this.state.pos, [id]: t }, moved: true });\n  };\n\n  spot(id) {\n    const d = DOCKETS.find(x => x.id === id);\n    return this.state.pos[id] || { col: d.col, row: d.row };\n  }\n\n  cur() { return DOCKETS.find(d => d.id === this.state.currentId) || DOCKETS[2]; }\n  draft(id) { return this.state.drafts[id] || [\"\", \"\", \"\"]; }\n  body(id) { return this.draft(id).filter(Boolean).join(\" \"); }\n\n  go(screen) { this.setState({ screen }); if (typeof window !== \"undefined\") window.scrollTo(0, 0); }\n\n  openDocket = (id) => {\n    const d = DOCKETS.find(x => x.id === id);\n    const drafts = { ...this.state.drafts };\n    if (!drafts[id]) drafts[id] = d.prompts.map(p => p.starter);\n    this.setState({ currentId: id, drafts, confirmed: false, copied: false, screen: \"compose\" });\n    if (typeof window !== \"undefined\") window.scrollTo(0, 0);\n  };\n\n  visitBuilding = (id) => {\n    this.setState({ focusId: id, screen: \"building\", read: this.state.read.concat([id]) });\n    if (typeof window !== \"undefined\") window.scrollTo(0, 0);\n  };\n\n  claim = () => {\n    const id = this.cur y your own words.\" : \" buildings, raised by your own words.\"),\n      mapHint: s.built.length === 0\n        ? \"Nothing to explore yet — go find a rule worth two minutes.\"\n        : (this.props.townMode ?? \"walk\") === \"walk\" && mapStyle === \"iso\"\n          ? \"Walk with the arrow keys or W A S D. Stand next to a building and press Enter to go inside. Drag a building to move it to another plot.\"\n          : \"Drag a building to any plot you like. Tap one to see what happened to the rule you commented on — a dot means there's news.\",\n      stats: [\n        { value: s.built.length, label: \"Buildings\" },\n        { value: builtDockets.filter(d => d && d.status.indexOf(\"Open\") === 0).length, label: \"Still open\" },\n        { value: s.built.length ? \"1\" : \"0\", label: \"Week streak\" }\n      ],\n      walkMode: (this.props.townMode ?? \"walk\") === \"walk\" && mapStyle === \"iso\",\n      avatarRef: this.avatarRef,\n      avatarStyle: \"position:absolute;left:350px;top:70px;pointer-events:none;z-index:14;transform:translate(-50%,-100%);\",\n      nearName: (() => {\n        const d = DOCKETS.find(x => x.id === s.near);\n        return d ? d.reward.replace(/^the /, \"\").replace(/^./, c => c.toUpperCase()) : \"\";\n      })(),\n      nearPrompt: !!s.near,\n      promptStyle: (() => {\n        if (!s.near) return \"display:none;\";\n        const p = this.spot(s.near), sc = this.toScreen(p.col, p.row);\n        return \"position:absolute;left:\" + sc.x + \"px;top:\" + (sc.y - 96) + \"px;transform:translate(-50%,-100%);z-index:60;\" +\n          \"background:var(--color-accent);color:var(--color-neutral-100);font-family:var(--font-heading);font-size:13px;\" +\n          \"padding:7px 15px;border-radius:999px;box-shadow:var(--shadow-md);white-space:nowrap;cursor:pointer;border:0;\" +\n          \"animation:plotOpen .2s ease both;\";\n      })(),\n      enterNear: () => { if (s.near) this.visitBuilding(s.near); },\n      gridRef: this.gridRef, onGridMove: this.onGridMove,\n      onGridUp: () => { if (s.dragId) this.setState({ dragId: null }); },\n      tiles: Array.from({ length: 16 }, (_, k) => {\n        const col = k % 4, row = Math.floor(k / 4);\n        const x = 350 + (col - row) * 66, y = 70 + (col + row) * 38;\n        const here = builtDockets.some(d => d && this.spot(d.id).col === col && this.spot(d.id).row === row);\n        const target = s.dragId && this.spot(s.dragId).col === col && this.spot(s.dragId).row === row;\n        return { style: \"position:absolute;left:\" + (x - 66) + \"px;top:\" + (y - 38) + \"px;width:132px;height:76px;\" +\n          \"clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);transition:background .15s;background:\" +\n          (target ? \"var(--color-accent-300)\" : here ? \"var(--color-accent-2-300)\"\n            : (col + row) % 2 ? \"var(--color-accent-2-200)\" : \"var(--color-neutral-200)\") + \";\" };\n      }),\n      buildings: builtDockets.filter(Boolean).map(d => {\n        const p = this.spot(d.id);\n        const x = 350 + (p.col - p.row) * 66, y = 70 + (p.col + p.row) * 38;\n        const dragging = s.dragId === d.id;\n        return {\n          name: d.reward.replace(/^the /, \"\").replace(/^./, c => c.toUpperCase()),\n          bodyPath: I[d.icon].b, detailPath: I[d.icon].d, unread: !s.read.includes(d.id),\n          latest: d.updates[d.updates.length - 1].label,\n          plotStyle: \"position:absolute;left:\" + x + \"px;top:\" + y + \"px;\" +\n            \"transform:translate(-50%,-84%)\" + (dragging ? \" scale(1.08)\" : \"\") + \";\" +\n            \"z-index:\" + (dragging ? 50 : Math.round(12 + (p.col + p.row) * 4)) + \";transition:left .16s ease,top .16s ease,transform .12s ease;\" +\n            \"display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:0;color:inherit;\" +\n            \"cursor:\" + (dragging ? \"grabbing\" : \"grab\") + \";touch-action:none;\" +\n            (dragging ? \"filter:drop-shadow(0
